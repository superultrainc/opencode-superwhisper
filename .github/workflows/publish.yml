name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example, v1.1.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install -g npm@latest
      - name: Verify version matches release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Release tag $TAG_VERSION doesn't match package.json $PKG_VERSION"
            exit 1
          fi
      - name: Verify npm repository identity
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const expected = `https://github.com/${process.env.GITHUB_REPOSITORY}`;
          if (pkg.repository?.url !== expected) {
            console.error(`package.json repository.url must be ${expected} for npm trusted publishing and provenance.`);
            process.exit(1);
          }
          NODE
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - name: Publish to npm using trusted publishing
        run: npm publish --access public --provenance
